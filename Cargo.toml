[workspace]
resolver = "3"
members = ["crates/well-core", "firmware"]
# Root-level cargo commands are host-only; the firmware is built from firmware/.
default-members = ["crates/well-core"]

[profile.release]
opt-level = "s"

# Unoptimized builds are too large and stack-hungry for the MCU.
[profile.dev]
opt-level = "z"
