[build]
target = "xtensa-esp32-espidf"
# esp-idf-sys rejects long output paths on Windows, so the build output lives outside the project.
target-dir = "C:/bw"

# No `runner` on purpose: `cargo run` must never flash the device.
[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32"
ESP_IDF_VERSION = "v5.5.3"
ESP_IDF_TOOLS_INSTALL_DIR = "global"
# Needed because target-dir is moved out of the project.
CARGO_WORKSPACE_DIR = { value = "", relative = true }
# Copies partitions.csv next to the generated ESP-IDF project so the custom table is found.
ESP_IDF_GLOB_PT_BASE = { value = "", relative = true }
ESP_IDF_GLOB_PT_FILE = "partitions.csv"
