[package]
name = "buzsak_well"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "buzsak_well"
harness = false # no libtest on the target

[dependencies]
anyhow = "1"
base64 = "0.22"
esp-idf-svc = "0.53"
log = "0.4"
sha2 = "0.10"
well-core = { path = "../crates/well-core" }

[features]
# Simulator build (QEMU): Ethernet instead of Wi-Fi, short soak, accepts pre-release images. Never for the device.
qemu = []
fault-panic = ["qemu"]
fault-panic-late = ["qemu"]
fault-unhealthy = ["qemu"]

[build-dependencies]
embuild = "0.33.5"
